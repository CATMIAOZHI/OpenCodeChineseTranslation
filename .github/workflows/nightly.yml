name: Nightly Build

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if upstream unchanged'
        type: boolean
        default: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: anomalyco/opencode
  UPSTREAM_BRANCH: v1.18.11
  RELEASE_TAG: v1.18.11

jobs:
  check-upstream:
    name: Check Upstream Updates
    runs-on: ubuntu-latest
    outputs:
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      upstream_date: ${{ steps.check.outputs.upstream_date }}
      changelog: ${{ steps.check.outputs.changelog || '' }}
      skip_build: ${{ steps.check.outputs.skip_build }}
    steps:
      - name: Checkout state file
        uses: actions/checkout@v4
        with:
          sparse-checkout: .nightly-state

      - name: Get upstream info
        id: check
        run: |
          UPSTREAM_SHA=$(git ls-remote https://github.com/${{ env.UPSTREAM_REPO }}.git refs/tags/${{ env.UPSTREAM_BRANCH }} | cut -f1)
          UPSTREAM_DATE=$(TZ='Asia/Shanghai' date +"%Y%m%d-%H%M")

          # Get changelog via GitHub API (faster than cloning)
          CHANGELOG=$(gh api repos/${{ env.UPSTREAM_REPO }}/commits/$UPSTREAM_SHA -q '.commit.message' 2>/dev/null || echo "")
          if [ -n "$CHANGELOG" ]; then
            CHANGELOG="- ${CHANGELOG} (\`${UPSTREAM_SHA:0:7}\`)"
          fi

          # Check if rebuild needed
          LAST=$(cat .nightly-state 2>/dev/null || echo "")
          FORCE="${{ inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "Force rebuild enabled"
            echo "skip_build=false" >> $GITHUB_OUTPUT
          elif [ "$UPSTREAM_SHA" = "$LAST" ] && [ -n "$LAST" ]; then
            echo "Upstream unchanged ($UPSTREAM_SHA), skipping build"
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "New upstream SHA: $UPSTREAM_SHA (was: ${LAST:-none})"
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "upstream_date=$UPSTREAM_DATE" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-cli:
    name: Build CLI Tool
    runs-on: windows-latest
    needs: check-upstream
    if: needs.check-upstream.outputs.skip_build != 'true'
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli-go/go.mod

      - name: Build CLI
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          cd cli-go
          go build -ldflags="-s -w" -o ../dist/opencode-cli-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} .

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  build-opencode:
    name: Build OpenCode Chinese
    runs-on: ${{ matrix.runner }}
    needs: [check-upstream, build-cli]
    if: needs.check-upstream.outputs.skip_build != 'true'
    strategy:
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli-go/go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Build CLI for current platform
        shell: bash
        run: |
          cd cli-go
          go build -o ../opencode-cli${{ runner.os == 'Windows' && '.exe' || '' }} .

      - name: Clone OpenCode source
        shell: bash
        run: |
          git clone --depth 1 --branch ${{ env.UPSTREAM_BRANCH }} https://github.com/${{ env.UPSTREAM_REPO }}.git opencode-zh-CN

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            opencode-zh-CN/node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('opencode-zh-CN/bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        working-directory: opencode-zh-CN
        run: bun install --frozen-lockfile

      - name: Apply Chinese translation
        shell: bash
        env:
          OPENCODE_SOURCE_DIR: ${{ github.workspace }}/opencode-zh-CN
        run: |
          CLI=./opencode-cli${{ runner.os == 'Windows' && '.exe' || '' }}
          "$CLI" apply

      - name: Build OpenCode
        shell: bash
        env:
          OPENCODE_SOURCE_DIR: ${{ github.workspace }}/opencode-zh-CN
          OPENCODE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          CLI=./opencode-cli${{ runner.os == 'Windows' && '.exe' || '' }}
          echo "=== Build Environment ==="
          echo "Platform: ${{ matrix.platform }}"
          echo "OPENCODE_SOURCE_DIR: $OPENCODE_SOURCE_DIR"
          echo "Bun version: $(bun --version)"
          echo ""
          echo "=== Starting build ==="
          "$CLI" build --platform ${{ matrix.platform }} --deploy=false
          echo ""
          echo "=== Post-build: dist directory ==="
          find opencode-zh-CN/packages/opencode/dist -type f 2>/dev/null | head -30 || echo "dist directory not found"

      - name: Package
        shell: pwsh
        env:
          NIGHTLY_DATE: ${{ needs.check-upstream.outputs.upstream_date }}
        run: |
          $VERSION = "${{ env.RELEASE_TAG }}"
          $PLATFORM = "${{ matrix.platform }}"
          $PACKAGE_NAME = "opencode-zh-CN-${VERSION}-${PLATFORM}"
          $BUILD_DIR = "opencode-zh-CN/packages/opencode/dist/opencode-${PLATFORM}/bin"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$BUILD_DIR/opencode.exe" -DestinationPath "dist/${PACKAGE_NAME}.zip" -Force
          Write-Output "✓ Created dist/${PACKAGE_NAME}.zip"
          Get-ChildItem dist/

      - name: Upload OpenCode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-${{ matrix.platform }}
          path: dist/*.zip

  release:
    name: Create/Update Nightly Release
    needs: [check-upstream, build-cli, build-opencode]
    if: needs.check-upstream.outputs.skip_build != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download CLI Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Download OpenCode Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opencode-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find dist -type f | head -50
          ls -la dist/ || true

      - name: Package i18n tool
        run: |
          zip -r dist/opencode-i18n-tool-nightly.zip \
            cli-go/ \
            install.ps1 \
            install.sh \
            README.md \
            CHANGELOG.md \
            -x "cli-go/.git/*" \
            -x "*.exe"

      - name: Generate Release Notes
        env:
          NIGHTLY_DATE: ${{ needs.check-upstream.outputs.upstream_date }}
          UPSTREAM_SHA: ${{ needs.check-upstream.outputs.upstream_sha }}
          CHANGELOG: ${{ needs.check-upstream.outputs.changelog }}
        run: |
          cat > release_notes.md << 'EOF'
          ## OpenCode 中文汉化版 ${{ env.RELEASE_TAG }}
          
          基于上游 ${{ env.UPSTREAM_BRANCH }} 构建的中文汉化版。
          
          ---
          
          ### 📊 构建信息
          
          | 项目 | 值 |
          |------|-----|
          EOF
          
          echo "| 上游版本 | \`${{ env.UPSTREAM_BRANCH }}\` |" >> release_notes.md
          echo "| 上游 Commit | [\`${UPSTREAM_SHA:0:8}\`](https://github.com/${{ env.UPSTREAM_REPO }}/commit/$UPSTREAM_SHA) |" >> release_notes.md
          echo "| 构建时间 | $(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M CST") |" >> release_notes.md
          
          cat >> release_notes.md << 'EOF'
          
          ---
          
          ### 📦 下载
          
          | 平台 | 文件 |
          |------|------|
          | Windows x64 | `opencode-zh-CN-${{ env.RELEASE_TAG }}-windows-x64.zip` |
          
          ---
          
          ### 🚀 使用方法
          
          1. 下载 ZIP 文件
          2. 解压得到 `opencode.exe`
          3. 双击运行即可
          
          EOF
          echo "=== Generated Release Notes ==="
          cat release_notes.md

      - name: Delete old release
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 0
          delete_tag_pattern: v*
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "OpenCode 中文汉化版 ${{ env.RELEASE_TAG }}"
          body_path: release_notes.md
          files: |
            dist/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update state
        env:
          UPSTREAM_SHA: ${{ needs.check-upstream.outputs.upstream_sha }}
        run: |
          echo "$UPSTREAM_SHA" > .nightly-state
          echo "Updated .nightly-state with SHA: $UPSTREAM_SHA"
          
          # 提交状态文件
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .nightly-state
          git commit -m "chore: update build state [skip ci]

          Upstream: ${{ env.UPSTREAM_REPO }}@${UPSTREAM_SHA:0:8}" || echo "No changes to commit"
          git push || echo "Push failed, state will be updated on next run"
